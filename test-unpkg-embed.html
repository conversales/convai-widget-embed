<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversales Unpkg Embed Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 24px;
      }

      .card {
        width: min(640px, 100%);
        min-height: 80vh;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        padding: 24px;
      }

      h1 {
        margin-top: 0;
        font-size: 24px;
      }

      p {
        color: #555;
      }

      .status {
        margin: 16px 0 24px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #f1f5f9;
        color: #0f172a;
        font-size: 14px;
        line-height: 1.5;
      }

      .status strong {
        display: block;
        margin-bottom: 4px;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(180px, 1.2fr) minmax(160px, 1fr) minmax(160px, 1fr) minmax(180px, 1fr) auto;
        gap: 12px;
        align-items: end;
        margin: 16px 0;
      }

      .questions-panel {
        margin: 0 0 20px;
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: #fafafa;
      }

      .questions-panel h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }

      .questions-panel p {
        margin: 0 0 14px;
        font-size: 13px;
      }

      .question-grid {
        display: grid;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
        color: #374151;
        font-size: 13px;
        font-weight: 600;
      }

      .field input,
      .field select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        color: #111827;
        font: inherit;
        font-weight: 500;
        min-height: 40px;
        padding: 8px 10px;
      }

      .color-row {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 8px;
      }

      .color-row input[type="color"] {
        padding: 4px;
      }

      .controls button {
        min-height: 40px;
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0 16px;
      }

      .color-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        border-radius: 999px;
        vertical-align: -1px;
      }

      @media (min-width: 880px) {
        main {
          padding-right: 420px;
        }
      }

      @media (max-width: 720px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Conversales unpkg embed test</h1>
        <p>If the package is working, the widget should render on this page.</p>
        <p id="source-label"></p>
        <form class="controls" id="config-form">
          <label class="field">
            Agent ID
            <input
              id="agent-id-input"
              name="agentId"
              type="text"
              placeholder="Enter agent ID"
            />
          </label>
          <label class="field">
            Name
            <input id="agent-name-input" name="name" type="text" />
          </label>

          <label class="field">
            Color
            <span class="color-row">
              <input id="theme-color-picker" name="colorPicker" type="color" />
              <input
                id="theme-color-input"
                name="color"
                type="text"
                inputmode="text"
                placeholder="#3656d4"
              />
            </span>
          </label>
          <button type="submit">Apply</button>
        </form>
        <section class="questions-panel">
          <h2>Predefined questions</h2>
          <p>Add up to 5 starter questions. The widget preview updates when you click Apply.</p>
          <div class="question-grid" id="question-grid">
            <label class="field">
              Question 1
              <input class="question-input" data-question-index="0" type="text" placeholder="Suggest me whey protein" />
            </label>
            <label class="field">
              Question 2
              <input class="question-input" data-question-index="1" type="text" placeholder="What is Creatine Nano400" />
            </label>
            <label class="field">
              Question 3
              <input class="question-input" data-question-index="2" type="text" placeholder="Difference between whey and protein" />
            </label>
            <label class="field">
              Question 4
              <input class="question-input" data-question-index="3" type="text" placeholder="Track my order" />
            </label>
            <label class="field">
              Question 5
              <input class="question-input" data-question-index="4" type="text" placeholder="Show best sellers" />
            </label>
          </div>
        </section>
        <div class="status" id="status">
          <strong>Checking widget status...</strong>
          Waiting for the widget bundle to load.
        </div>
        <div id="widget-root"></div>
      </section>
    </main>
    <script>
      const status = document.getElementById("status");
      const sourceLabel = document.getElementById("source-label");
      const widgetRoot = document.getElementById("widget-root");
      const configForm = document.getElementById("config-form");
      const agentIdInput = document.getElementById("agent-id-input");
      const agentNameInput = document.getElementById("agent-name-input");
      const questionInputs = Array.from(document.querySelectorAll(".question-input"));

      const themeColorPicker = document.getElementById("theme-color-picker");
      const themeColorInput = document.getElementById("theme-color-input");
      const searchParams = new URLSearchParams(window.location.search);
      const defaultAccentColor = "#3656d4";
      const supportedTags = ["conversales-convai"];
      const productCardModes = {
        current: {
          label: "current agent",
          overrideConfig: null,
        },
      };
      let currentAgentId = searchParams.get("agentId") || "";
      let currentAccountId = searchParams.get("accountId") || "";
      let currentAgentName =
        searchParams.get("name") ||
        searchParams.get("nam") ||
        searchParams.get("agentName") ||
        "";
      let currentAccentColor =
        normalizeHexColor(
          searchParams.get("color") ||
            searchParams.get("accentColor") ||
            searchParams.get("accent-color") ||
            ""
        ) || defaultAccentColor;
      let currentQuestions = Array.from({ length: 5 }, (_, index) =>
        searchParams.get(`q${index + 1}`) || ""
      );
      const source = searchParams.get("source") || "local";
      const leadCapture = searchParams.get("leadCapture") || "on";
      const productCardsMode = productCardModes[searchParams.get("productCards")]
        ? searchParams.get("productCards")
        : "current";
      const embedMode = searchParams.get("embedMode") || "widget-attributes";
      const leadCaptureEnabled = leadCapture !== "off";
      const useScriptLeadCapture = embedMode === "script-attributes";
      const bundleSources = {
        local:
          "/packages/convai-widget-embed/dist/index.js?localBuild=" +
          Date.now(),
        unpkg: "https://unpkg.com/@conversales/convai-widget-embed",
      };
      const bundleSrc = bundleSources[source] || bundleSources.local;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => {
          switch (character) {
            case "&":
              return "&amp;";
            case "<":
              return "&lt;";
            case ">":
              return "&gt;";
            case '"':
              return "&quot;";
            case "'":
              return "&#39;";
            default:
              return character;
          }
        });
      }

      function normalizeHexColor(value) {
        const trimmed = String(value || "").trim();
        if (!trimmed) {
          return "";
        }

        const withHash = trimmed.startsWith("#") ? trimmed : "#" + trimmed;
        return /^#[0-9a-fA-F]{6}$/.test(withHash)
          ? withHash.toLowerCase()
          : "";
      }

      function getCurrentProductCardMode() {
        return "current";
      }

      function getEffectiveAgentId() {
        return agentIdInput.value.trim() || currentAgentId;
      }

      function getEffectiveOverrideConfig() {
        const selectedMode = getCurrentProductCardMode();
        const baseOverride = productCardModes[selectedMode].overrideConfig;
        const predefinedQuestions = questionInputs
          .map(input => input.value.trim())
          .filter(Boolean)
          .slice(0, 5);

        if (predefinedQuestions.length === 0) {
          return baseOverride;
        }

        return {
          ...(baseOverride || {}),
          predefined_questions: predefinedQuestions,
        };
      }

      function buildPresetHref(nextSource, nextLeadCapture) {
        const params = new URLSearchParams();
        params.set("source", nextSource);
        params.set("leadCapture", nextLeadCapture);
        return "?" + params.toString();
      }

      function buildHref(nextSource, nextLeadCapture) {
        const params = new URLSearchParams();
        const nextAgentId = agentIdInput.value.trim() || currentAgentId;
        const nextName = agentNameInput.value.trim() || currentAgentName;
        const nextColor =
          normalizeHexColor(themeColorInput.value) || currentAccentColor;
        const nextQuestions = questionInputs
          .map(input => input.value.trim())
          .slice(0, 5);

        params.set("source", nextSource);
        params.set("leadCapture", nextLeadCapture);

        if (nextAgentId) {
          params.set("agentId", nextAgentId);
        }
        if (currentAccountId) {
          params.set("accountId", currentAccountId);
        }
        params.set("color", nextColor);
        if (nextName) {
          params.set("name", nextName);
        }
        nextQuestions.forEach((question, index) => {
          const key = `q${index + 1}`;
          if (question) {
            params.set(key, question);
          } else {
            params.delete(key);
          }
        });
        return "?" + params.toString();
      }

      const currentLeadLabel = leadCaptureEnabled
        ? "with lead"
        : "without lead";
      const currentModeLabel =
        embedMode === "widget-attributes"
          ? ""
          : " · Mode: <strong>" + embedMode + "</strong>";

      function renderSourceLabel() {
        sourceLabel.innerHTML =
          "Source: <strong>" +
          escapeHtml(source) +
          "</strong> · Lead: <strong>" +
          escapeHtml(currentLeadLabel) +
          "</strong> · Agent: <strong>" +
          escapeHtml(getEffectiveAgentId() || "(not set)") +
          "</strong>" +
          (currentAgentName
            ? " · Name: <strong>" + escapeHtml(currentAgentName) + "</strong>"
            : "") +
          ' · Color: <span class="color-chip"><span class="swatch" style="background-color: ' +
          currentAccentColor +
          '"></span><strong>' +
          escapeHtml(currentAccentColor) +
          "</strong></span>" +
          currentModeLabel +
          ' · <a href="' +
          buildPresetHref("local", "on") +
          '">local with lead</a> · <a href="' +
          buildPresetHref("local", "off") +
          '">local without lead</a> · <a href="' +
          buildPresetHref("unpkg", "on") +
          '">unpkg with lead</a> · <a href="' +
          buildPresetHref("unpkg", "off") +
            '">unpkg without lead</a>';
      }

      agentIdInput.value = currentAgentId;
      agentNameInput.value = currentAgentName;
      questionInputs.forEach((input, index) => {
        input.value = currentQuestions[index] || "";
      });

      themeColorPicker.value = currentAccentColor;
      themeColorInput.value = currentAccentColor;

      renderSourceLabel();

      function applyControlValuesToWidget() {
        const widget = widgetRoot.firstElementChild;
        if (!widget) {
          return;
        }

        const nextAgentId = getEffectiveAgentId();
        const nextName = agentNameInput.value.trim();
        const nextColor =
          normalizeHexColor(themeColorInput.value) || currentAccentColor;

        if (nextAgentId) {
          widget.setAttribute("agent-id", nextAgentId);
        } else {
          widget.removeAttribute("agent-id");
        }

        const nextOverrideConfig = getEffectiveOverrideConfig();
        if (nextOverrideConfig) {
          widget.setAttribute(
            "override-config",
            JSON.stringify(nextOverrideConfig)
          );
        } else {
          widget.removeAttribute("override-config");
        }

        if (nextName) {
          widget.setAttribute("agent-name", nextName);
        } else {
          widget.removeAttribute("agent-name");
        }

        widget.setAttribute("accent-color", nextColor);
      }

      themeColorPicker.addEventListener("input", () => {
        themeColorInput.value = themeColorPicker.value;
        applyControlValuesToWidget();
      });

      themeColorInput.addEventListener("input", () => {
        const nextColor = normalizeHexColor(themeColorInput.value);
        if (nextColor) {
          themeColorPicker.value = nextColor;
          applyControlValuesToWidget();
        }
      });

      agentNameInput.addEventListener("input", applyControlValuesToWidget);
      agentIdInput.addEventListener("input", applyControlValuesToWidget);
      questionInputs.forEach(input => {
        input.addEventListener("input", applyControlValuesToWidget);
      });

      configForm.addEventListener("submit", event => {
        event.preventDefault();

        const nextAgentId = getEffectiveAgentId();
        const nextName = agentNameInput.value.trim();
        const nextColor =
          normalizeHexColor(themeColorInput.value) || currentAccentColor;
        const nextQuestions = questionInputs
          .map(input => input.value.trim())
          .slice(0, 5);
        const params = new URLSearchParams(window.location.search);

        currentAgentId = agentIdInput.value.trim();
        currentAgentName = nextName;
        currentAccentColor = nextColor;
        currentQuestions = nextQuestions;

        params.set("source", source);
        params.set("leadCapture", leadCapture);
        if (nextAgentId) {
          params.set("agentId", nextAgentId);
        } else {
          params.delete("agentId");
        }
        if (currentAccountId) {
          params.set("accountId", currentAccountId);
        }
        params.set("color", nextColor);
        params.delete("v");
        params.delete("nam");
        params.delete("agentName");
        params.delete("productCards");

        if (nextName) {
          params.set("name", nextName);
        } else {
          params.delete("name");
        }

        nextQuestions.forEach((question, index) => {
          const key = `q${index + 1}`;
          if (question) {
            params.set(key, question);
          } else {
            params.delete(key);
          }
        });

        window.history.replaceState({}, "", "?" + params.toString());
        renderSourceLabel();

        const tagName = getRegisteredTag();
        if (tagName) {
          renderWidget(tagName, true);
        }
      });

      function applyWidgetAttributes(widget) {
        const nextAgentId = getEffectiveAgentId();
        if (nextAgentId) {
          widget.setAttribute("agent-id", nextAgentId);
        } else {
          widget.removeAttribute("agent-id");
        }
        if (currentAccountId) {
          widget.setAttribute("account-id", currentAccountId);
        } else {
          widget.removeAttribute("account-id");
        }
        widget.setAttribute("accent-color", currentAccentColor);

        const nextOverrideConfig = getEffectiveOverrideConfig();
        if (nextOverrideConfig) {
          widget.setAttribute(
            "override-config",
            JSON.stringify(nextOverrideConfig)
          );
        } else {
          widget.removeAttribute("override-config");
        }

        const nextName = agentNameInput.value.trim() || currentAgentName;
        if (nextName) {
          widget.setAttribute("agent-name", nextName);
        } else {
          widget.removeAttribute("agent-name");
        }

        if (leadCaptureEnabled && !useScriptLeadCapture) {
          widget.setAttribute("leads-capture", "true");
        } else {
          widget.removeAttribute("leads-capture");
        }

        widget.setAttribute("show-agent-status", "true");
      }

      function renderWidget(tagName, forceRemount = false) {
        const existingTagName =
          widgetRoot.firstElementChild?.tagName?.toLowerCase();

        if (existingTagName === tagName && !forceRemount) {
          applyWidgetAttributes(widgetRoot.firstElementChild);
          return;
        }

        widgetRoot.innerHTML = "";

        const widget = document.createElement(tagName);
        applyWidgetAttributes(widget);

        widgetRoot.appendChild(widget);
      }

      if (useScriptLeadCapture) {
        renderWidget(supportedTags[0]);
      }

      const bundleScript = document.createElement("script");
      bundleScript.id = "embed-bundle";
      bundleScript.async = true;
      bundleScript.type = "text/javascript";
      bundleScript.src = bundleSrc;

      if (useScriptLeadCapture && leadCaptureEnabled) {
        bundleScript.setAttribute("capture-lead", "true");
      }

      document.head.appendChild(bundleScript);

      function setStatus(title, message) {
        status.innerHTML = "<strong>" + title + "</strong>" + message;
      }

      function getRegisteredTag() {
        return supportedTags.find(tagName => customElements.get(tagName));
      }

      function updateWidgetStatus() {
        const tagName = getRegisteredTag();

        if (!tagName) {
          return false;
        }

        renderWidget(tagName);
        setStatus(
          "Bundle loaded",
          "The custom element `" +
            tagName +
            "` was registered successfully from <code>" +
            bundleSrc +
            "</code>. If the widget still does not render, the agent config request is likely failing."
        );

        return true;
      }

      Promise.race(
        supportedTags.map(tagName =>
          customElements.whenDefined(tagName).then(() => tagName)
        )
      )
        .then(tagName => {
          renderWidget(tagName);
          setStatus(
            "Bundle loaded",
            "The custom element `" +
              tagName +
              "` was registered successfully from <code>" +
              bundleSrc +
              "</code>. If the widget still does not render, the agent config request is likely failing."
          );
        })
        .catch(error => {
          setStatus("Registration failed", error.message);
        });

      bundleScript.addEventListener("load", () => {
        window.setTimeout(() => {
          if (!updateWidgetStatus()) {
            setStatus(
              "Bundle loaded without widget",
              "The bundle loaded from <code>" +
                bundleSrc +
                "</code>, but it did not register one of the expected custom elements."
            );
          }
        }, 0);
      });

      bundleScript.addEventListener("error", () => {
        setStatus(
          "Bundle failed to load",
          "The script request for <code>" +
            bundleSrc +
            "</code> failed before the widget could register."
        );
      });

      updateWidgetStatus();

      window.addEventListener("error", event => {
        if (typeof event.message === "string" && event.message) {
          setStatus("Runtime error", event.message);
        }
      });
    </script>
  </body>
</html>
